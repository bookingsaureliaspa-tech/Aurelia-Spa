/* ============================================================
   SHARED: Web3Forms submit helper
   ============================================================ */
async function submitToWeb3Forms(payload) {
  const res = await fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ access_key: WEB3FORMS_KEY, ...payload }),
  });
  return res.json();
}

/* ============================================================
   COPY TO CLIPBOARD HOOK
   ============================================================ */
function useCopy() {
  const [copied, setCopied] = useState(false);
  const copy = (text) => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  };
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }
  return [copied, copy];
}

function Slideshow() {
  const [index, setIndex] = useState(0);
  const timer = useRef(null);

  useEffect(() => {
    timer.current = setInterval(() => setIndex((i) => (i + 1) % SLIDES.length), 5000);
    return () => clearInterval(timer.current);
  }, []);

  const go = (i) => {
    clearInterval(timer.current);
    setIndex((i + SLIDES.length) % SLIDES.length);
    timer.current = setInterval(() => setIndex((i2) => (i2 + 1) % SLIDES.length), 5000);
  };

  return (
    <div className="relative w-full h-[320px] sm:h-[420px] md:h-[520px] rounded-md overflow-hidden card-surface">
      {SLIDES.map((src, i) => (
        <img key={i} src={src} alt={'Spa treatment ' + (i + 1)}
          className="slide-img absolute inset-0 w-full h-full object-cover"
          style={{ opacity: i === index ? 1 : 0 }} />
      ))}
      <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, transparent 50%, var(--overlay-dark))' }}></div>

      <button onClick={() => go(index - 1)} aria-label="Previous slide"
        className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass flex items-center justify-center" style={{ color: 'var(--accent)' }}>
        <ChevronLeft size={18} />

      <button onClick={() => go(index + 1)} aria-label="Next slide"
        className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass flex items-center justify-center" style={{ color: 'var(--accent)' }}>
        <ChevronRight size={18} />
      </button>

          <button key={i} onClick={() => go(i)} aria-label={'Go to slide ' + (i + 1)}

function CheckoutView({ selected, go, date, time, resetBooking }) {
  const selectedServices = SERVICES.filter((s) => selected.has(s.id));
  const total = selectedServices.reduce((sum, s) => sum + s.price, 0);
  const [method, setMethod] = useState('card');
  const [copied, copy] = useCopy();
  const [status, setStatus] = useState('idle'); // idle | sending | success | error
  const [card, setCard] = useState({ name: '', number: '', expiry: '', cvv: '' });

  if (selectedServices.length === 0 || !date || !time) {
    return (
      <div className="fade-view pt-32 pb-28 max-w-3xl mx-auto px-6 text-center">
        <h1 className="font-serif text-3xl mb-4">Nothing to check out yet</h1>
        <p className="mb-7" style={{ color: 'var(--text-muted)' }}>Please select your services, date, and time first.</p>
        <button onClick={() => go('booking')} className="btn-gold rounded-sm px-7 py-3 text-sm font-semibold">Go to Booking</button>
      </div>
    );
  }

  const handleConfirm = async (e) => {
    e.preventDefault();
    setStatus('sending');
    try {
      const result = await submitToWeb3Forms({
        subject: 'New Booking Request — Aurelia Spa',
        payment_method: method,
        services: selectedServices.map((s) => s.name).join(', '),
        date, time, total_price: '$' + total,
        name: card.name || 'Guest',
      });
      if (result.success) {
        setStatus('success');
      } else {
        setStatus('error');
      }
    } catch (err) {
      setStatus('error');
    }
  };

  if (status === 'success') {
    return (
      <div className="fade-view pt-32 pb-28 max-w-xl mx-auto px-6 text-center">
        <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-6" style={{ background: 'var(--border)' }}>
          <CheckCircleIcon size={30} style={{ color: 'var(--accent)' }} />
        </div>
        <h1 className="font-serif text-3xl mb-3">Booking Request Sent</h1>
        <p className="mb-8" style={{ color: 'var(--text-muted)' }}>Thank you — our concierge will confirm your reservation by email shortly.</p>
        <button onClick={() => { resetBooking(); go('home'); }} className="btn-gold rounded-sm px-7 py-3 text-sm font-semibold">Return Home</button>
      </div>
    );
  }

  return (
    <div className="fade-view pt-32 pb-28 max-w-5xl mx-auto px-6 lg:px-10">
      <div className="max-w-2xl mb-10">
        <p className="text-xs tracking-[0.25em] mb-4" style={{ color: 'var(--accent)' }}>Final Step</p>
        <h1 className="font-serif text-3xl md:text-4xl lg:text-5xl leading-tight">Checkout</h1>
      </div>

      <div className="grid lg:grid-cols-3 gap-8">
        <div className="lg:col-span-1 order-2 lg:order-1">
          <div className="card-surface rounded-md p-6 md:p-8 sticky top-28">
            <h3 className="font-serif text-xl mb-5">Order Summary</h3>
            <div className="space-y-3 mb-5">
              {selectedServices.map((s) => (
                <div key={s.id} className="flex justify-between text-sm">
                  <span style={{ color: 'var(--text-secondary)' }}>{s.name}</span>
                  <span>${s.price}</span>
                </div>
              ))}
            </div>
            <div className="space-y-2 text-sm mb-5 pt-4 border-t" style={{ borderColor: 'var(--border)', color: 'var(--text-secondary)' }}>
              <div className="flex justify-between"><span>Date</span><span>{date}</span></div>
              <div className="flex justify-between"><span>Time</span><span>{time}</span></div>
            </div>
            <div className="flex justify-between items-center border-t pt-4" style={{ borderColor: 'var(--border)' }}>
              <span className="text-sm" style={{ color: 'var(--text-muted)' }}>Total Due</span>
              <span className="font-serif text-2xl gold-text">${total}</span>
            </div>
          </div>
        </div>

        <div className="lg:col-span-2 order-1 lg:order-2 space-y-6">
          <div className="flex gap-3">
            <button onClick={() => setMethod('card')} className="flex-1 rounded-sm py-3 text-sm font-semibold flex items-center justify-center gap-2 border transition"
              style={{ borderColor: method === 'card' ? 'var(--accent)' : 'var(--border)', background: method === 'card' ? 'var(--border)' : 'transparent', color: method === 'card' ? 'var(--accent)' : 'var(--text-secondary)' }}>
              <CreditCardIcon size={16} /> Credit Card
            </button>
            <button onClick={() => setMethod('bitcoin')} className="flex-1 rounded-sm py-3 text-sm font-semibold flex items-center justify-center gap-2 border transition"
              style={{ borderColor: method === 'bitcoin' ? 'var(--accent)' : 'var(--border)', background: method === 'bitcoin' ? 'var(--border)' : 'transparent', color: method === 'bitcoin' ? 'var(--accent)' : 'var(--text-secondary)' }}>
              <BitcoinIcon size={16} /> Bitcoin
            </button>
          </div>

          <form onSubmit={handleConfirm} className="card-surface rounded-md p-6 md:p-8 space-y-6">
            {method === 'card' ? (
              <div className="space-y-5">
                <div>
                  <label className="field-label">NAME ON CARD</label>
                  <input required value={card.name} onChange={(e) => setCard({ ...card, name: e.target.value })}
                    placeholder="Jane Doe" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
                </div>
                <div>
                  <label className="field-label">CARD NUMBER</label>
                  <input required maxLength="19" value={card.number} onChange={(e) => setCard({ ...card, number: e.target.value })}
                    placeholder="4242 4242 4242 4242" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-5">
                  <div>
                    <label className="field-label">EXPIRY</label>
                    <input required value={card.expiry} onChange={(e) => setCard({ ...card, expiry: e.target.value })}
                      placeholder="MM/YY" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
                  </div>
                  <div>
                    <label className="field-label">CVV</label>
                    <input required maxLength="4" value={card.cvv} onChange={(e) => setCard({ ...card, cvv: e.target.value })}
                      placeholder="123" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
                  </div>
                </div>
                <p className="text-xs flex items-center gap-2" style={{ color: 'var(--text-muted)' }}>
                  <ShieldIcon size={13} /> Card details are for demo purposes and are not processed or stored.
                </p>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 gap-8 items-center">
                <div className="btc-qr-frame mx-auto">
                  <img src="BTC_qr-code.svg" alt="Bitcoin wallet QR code" className="w-40 h-40" />
                </div>
                <div>
                  <p className="field-label mb-2">BTC WALLET ADDRESS</p>
                  <div className="flex items-center gap-2 rounded-sm px-4 py-3 border mb-3" style={{ borderColor: 'var(--border)', background: 'var(--input-bg)' }}>
                    <code className="text-xs break-all flex-1" style={{ color: 'var(--accent)' }}>{BTC_ADDRESS}</code>
                  </div>
                  <button type="button" onClick={() => copy(BTC_ADDRESS)} className="w-full btn-gold rounded-sm py-3 text-sm font-semibold flex items-center justify-center gap-2">
                    {copied ? <CheckIcon size={15} /> : <CopyIcon size={15} />}
                    {copied ? 'Copied!' : 'Copy Address'}
                  </button>
                  <p className="text-xs mt-4 leading-relaxed" style={{ color: 'var(--text-muted)' }}>
                    Send the exact total to confirm your reservation. Deposits are credited toward your final treatment cost. Blockchain transactions cannot be reversed — verify the address carefully.
                  </p>
                </div>
              </div>
            )}

            {status === 'error' && (
              <p className="text-sm flex items-center gap-2 text-red-400"><AlertIcon size={15} /> Something went wrong sending your request. Please try again.</p>

            <button type="submit" disabled={status === 'sending'} className="w-full btn-gold rounded-sm py-4 text-sm font-semibold flex items-center justify-center gap-2">
              {status === 'sending' ? (<><LoaderIcon size={16} /> Processing…</>) : (<>Confirm &amp; Send Booking Request</>)}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

          {status === 'success' ? (
            <div className="text-center py-8">
              <CheckCircleIcon size={30} style={{ color: 'var(--accent)' }} className="mx-auto mb-4" />
              <p className="font-serif text-xl mb-1">Message Sent</p>
              <p className="text-sm" style={{ color: 'var(--text-muted)' }}>We'll reply within 24 hours.</p>
            </div>
          ) : (
            <>
              <div>
                <label className="field-label">FULL NAME</label>
                <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Jane Doe" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
              </div>
              <div>
                <label className="field-label">EMAIL ADDRESS</label>
                <input required type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="jane@email.com" className="w-full mt-2 rounded-sm px-4 py-3 text-sm" />
              </div>
              <div>
                <label className="field-label">MESSAGE</label>
                <textarea required rows="4" value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })} placeholder="How can we help?" className="w-full mt-2 rounded-sm px-4 py-3 text-sm resize-none"></textarea>
              </div>
              {status === 'error' && <p className="text-sm text-red-400 flex items-center gap-2"><AlertIcon size={14} /> Something went wrong. Please try again.</p>}
              <button type="submit" disabled={status === 'sending'} className="w-full btn-gold rounded-sm py-3.5 text-sm font-semibold flex items-center justify-center gap-2">
                {status === 'sending' ? (<><LoaderIcon size={16} /> Sending…</>) : 'Send Message'}
              </button>
            </>
          )}
        </form>
      </div>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const [view, setView] = useState('home');
  const [theme, setTheme] = useState('dark');
  const [selected, setSelected] = useState(new Set());
  const [date, setDate] = useState('');
  const [time, setTime] = useState('');

  useEffect(() => {
    const stored = localStorage.getItem('aurelia-theme');
    if (stored) {
      setTheme(stored);
    } else {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('aurelia-theme', theme);
  }, [theme]);

  const toggleTheme = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));

  const go = (v) => { setView(v); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const toggleService = (id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const resetBooking = () => { setSelected(new Set()); setDate(''); setTime(''); };

  return (
    <React.Fragment>
      <Navbar view={view} go={go} theme={theme} toggleTheme={toggleTheme} />
      {view === 'home' && <HomeView go={go} />}
      {view === 'services' && <ServicesView selected={selected} toggleService={toggleService} go={go} />}
      {view === 'booking' && <BookingView selected={selected} toggleService={toggleService} go={go} date={date} setDate={setDate} time={time} setTime={setTime} />}
      {view === 'checkout' && <CheckoutView selected={selected} go={go} date={date} time={time} resetBooking={resetBooking} />}
      {view === 'contact' && <ContactView />}
      <Footer go={go} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
